<div *ngIf="isOpen" class="expense-add-modal">
  <div class="dialog-backdrop" (click)="onClose()"></div>
  <mat-card class="dialog-card">
    <mat-card-title>Agregar Gasto</mat-card-title>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Descripción</mat-label>
        <input matInput type="text" formControlName="description" maxlength="200" />
        <mat-error *ngIf="form.controls['description'].hasError('required')">La descripción es requerida.</mat-error>
        <mat-error *ngIf="form.controls['description'].hasError('maxlength')">Máximo 200 caracteres.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Monto</mat-label>
        <input matInput type="number" formControlName="amount" step="0.01" min="0.01" />
        <span matPrefix>$&nbsp;</span>
        <mat-error *ngIf="form.controls['amount'].hasError('required')">El monto es requerido.</mat-error>
        <mat-error *ngIf="form.controls['amount'].hasError('min')">El monto debe ser mayor a 0.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Pagado por</mat-label>
        <mat-select formControlName="payerId" [disabled]="loadingMembers">
          <mat-option *ngFor="let member of members" [value]="member.userId">
            {{ member.nombre || member.email }}
          </mat-option>
          <mat-option *ngIf="loadingMembers" disabled>Cargando miembros...</mat-option>
          <mat-option *ngIf="!loadingMembers && members.length === 0" disabled>No hay miembros activos</mat-option>
        </mat-select>
        <mat-error *ngIf="form.controls['payerId'].hasError('required')">Seleccioná quién pagó.</mat-error>
      </mat-form-field>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <div class="dialog-actions">
        <button mat-button type="button" (click)="onClose()">Cancelar</button>
        <button mat-raised-button color="primary" type="submit" [disabled]="submitting">
          {{ submitting ? 'Agregando...' : 'Agregar Gasto' }}
        </button>
      </div>
    </form>
  </mat-card>
</div>
