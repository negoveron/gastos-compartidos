<div class="expense-list-page">
  <mat-card class="expense-list-card">
    <mat-card-title>
      <span>Gastos de {{ groupName }}</span>
      <button mat-button color="primary" (click)="navigateToBalances()" class="balance-link">
        Ver Balances
      </button>
    </mat-card-title>

    <button mat-raised-button color="primary" (click)="openAddModal()" class="add-button" [disabled]="loadingMembers">
      <mat-icon>add</mat-icon>
      Agregar Gasto
    </button>

    <div *ngIf="expenses$ | async as expenses">
      <table mat-table [dataSource]="expenses" class="expenses-table">
        <!-- Description Column -->
        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef>Descripción</th>
          <td mat-cell *matCellDef="let expense">{{ expense.description }}</td>
        </ng-container>

        <!-- Amount Column -->
        <ng-container matColumnDef="amount">
          <th mat-header-cell *matHeaderCellDef>Monto</th>
          <td mat-cell *matCellDef="let expense">{{ formatAmount(expense.amountCents) }}</td>
        </ng-container>

        <!-- Payer Column -->
        <ng-container matColumnDef="payer">
          <th mat-header-cell *matHeaderCellDef>Pagado por</th>
          <td mat-cell *matCellDef="let expense">{{ getPayerName(expense.payerId) }}</td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Fecha</th>
          <td mat-cell *matCellDef="let expense">{{ formatDate(expense.createdAt) }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Acciones</th>
          <td mat-cell *matCellDef="let expense">
            <button mat-icon-button color="primary" matTooltip="Ver detalles" disabled>
              <mat-icon>visibility</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>

      <div *ngIf="expenses.length === 0" class="no-expenses">
        <p>No hay gastos registrados en este grupo.</p>
        <p class="hint">¡Agregá el primero usando el botón de arriba!</p>
      </div>
    </div>
  </mat-card>
</div>

<!-- Add Expense Modal -->
<app-expense-add-modal
  [isOpen]="addModalOpen"
  [groupId]="groupId"
  [members]="members"
  [loadingMembers]="loadingMembers"
  (close)="closeAddModal()"
  (submitted)="onExpenseSubmitted($event)"
>
</app-expense-add-modal>
