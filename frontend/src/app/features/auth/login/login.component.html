<div class="login-page">
  <mat-card class="login-card">
    <mat-card-title>Iniciar sesión</mat-card-title>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Email</mat-label>
        <input matInput type="email" formControlName="email" autocomplete="email" />
        <mat-error *ngIf="form.controls['email'].hasError('required')">El email es requerido.</mat-error>
        <mat-error *ngIf="form.controls['email'].hasError('email')">Ingresá un email válido.</mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline" class="full-width">
        <mat-label>Contraseña</mat-label>
        <input matInput type="password" formControlName="password" autocomplete="current-password" />
        <mat-error *ngIf="form.controls['password'].hasError('required')">La contraseña es requerida.</mat-error>
      </mat-form-field>

      <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>

      <button mat-raised-button color="primary" type="submit" class="full-width" [disabled]="submitting">
        {{ submitting ? 'Ingresando...' : 'Ingresar' }}
      </button>
    </form>

    <p class="switch-link">
      ¿No tenés cuenta? <a routerLink="/register">Registrate</a>
    </p>
  </mat-card>
</div>
